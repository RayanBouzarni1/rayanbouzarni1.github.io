<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My pages</title>
        <meta name="author" content="Rayan Bouzarni">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="All of my projects on a single page.">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
 
            * { box-sizing: border-box; margin: 0; padding: 0; }
 
            html {
                padding: 2em;
                background:
                    linear-gradient(135deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 63, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 127, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 63, 127, 0.4) 0%, transparent 75%);
                background-color: #0a0a0a;
                min-height: 100vh;
                background-attachment: fixed;
                color: #dff;
                font-family: 'Share Tech Mono', monospace;
            }
 
            h1 {
                font-family: 'Orbitron', sans-serif;
                font-size: 1.6em;
                letter-spacing: 0.12em;
                color: #aff;
                margin-bottom: 1.2em;
                text-shadow: 0 0 18px rgba(0,255,255,0.3);
            }
 
            button,
            .file-label {
                cursor: pointer;
                border: 2px solid transparent;
                border-radius: 4px;
                padding: 0.5em 1em;
                text-align: center;
                display: inline-block;
                line-height: 2em;
                background:
                    linear-gradient(135deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 63, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 127, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 63, 127, 0.4) 0%, transparent 75%),
                    padding-box,
                    linear-gradient(135deg, rgba(0, 0, 255, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 255, 255, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 127, 255, 0.4) 0%, transparent 75%);
                color: #dff;
                font-family: 'Share Tech Mono', monospace;
                font-size: 1em;
                transition: opacity 0.15s;
            }
 
            button:hover,
            .file-label:hover { opacity: 0.8; }
 
            #output {
                font-size: 0.85em;
                color: rgba(150, 220, 255, 0.6);
                line-height: 1.6;
                display: block;
                margin-top: 1em;
            }
 
            #output a {
                color: #8cf;
                text-decoration: none;
            }
 
            #output a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1>HTML Compressor</h1><br>
        <label class="file-label">
            <input type="file" accept=".html" hidden>
            Select a file...
        </label><br><br>
        <span id="output"></span>
        <script type="module">
            import { ZstdInit } from "https://cdn.jsdelivr.net/npm/@oneidentity/zstd-js/+esm";

            const { ZstdSimple } = await ZstdInit(),
            input = document.querySelector("input[type=file]");

            input.addEventListener("change", () => {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = e => {
                    const data = new TextEncoder().encode(e.target.result);
                    const compressed = ZstdSimple.compress(data, 22);
                    const b64 = btoa(String.fromCharCode(...compressed));

                    const output = `<script type="module">import{ZstdInit}from"https://cdn.jsdelivr.net/npm/@oneidentity/zstd-js/+esm";const{ZstdSimple}=await ZstdInit();const d=ZstdSimple.decompress(Uint8Array.from(atob("${b64}"),c=>c.charCodeAt(0)));document.open();document.write(new TextDecoder().decode(d));document.close();<\/script>`;

                    const url = URL.createObjectURL(new Blob([output], { type: "text/html" }));
                    document.getElementById("output").innerHTML =
                        `Compressed: ${output.length} bytes (original: ${data.length} bytes). <a href="${url}" download="${file.name}"><u>Download</u></a>`;
                };
                reader.readAsText(file);
            });
        </script>
    </body>
</html>
