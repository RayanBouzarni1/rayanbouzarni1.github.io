function generateBoundaries() {
  boundaries = [];
  const shapes = ["triangle", "square", "pentagon", "hexagon", "circle"];
  const count = 2 + Math.floor(Math.random() * 4);
  for (let a = 0; a < count * 5 && boundaries.length < count; a++) {
    const type = shapes[Math.floor(Math.random() * shapes.length)];
    const r = 35 + Math.random() * 55;
    const x = r + 90 + Math.random() * (GAME_W - (r + 90) * 2);
    const ty = getTerrainY(x);
    const minY = r + 60,
      maxY = ty - r - 80;
    if (maxY < minY) continue;
    const y = minY + Math.random() * (maxY - minY);
    if (
      boundaries.some(
        (b) => Math.hypot(x - b.cx, y - b.cy) < r + b.r + 60,
      )
    )
      continue;
    if (type == "circle") {
      boundaries.push({ type: "circle", cx: x, cy: y, r });
    } else {
      const sides = { triangle: 3, square: 4, pentagon: 5, hexagon: 6 }[
        type
      ];
      const rot = Math.random() * Math.PI * 2;
      const vertices = Array.from({ length: sides }, (_, i) => ({
        x: x + Math.cos(rot + (i * Math.PI * 2) / sides) * r,
        y: y + Math.sin(rot + (i * Math.PI * 2) / sides) * r,
      }));
      boundaries.push({
        type: "polygon",
        sides,
        cx: x,
        cy: y,
        r,
        vertices,
      });
    }
  }
}
function closestPointOnSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax,
    dy = by - ay,
    len2 = dx * dx + dy * dy;
  if (len2 < 0.001) return { x: ax, y: ay };
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
  return { x: ax + t * dx, y: ay + t * dy };
}
function checkBoundaryCollision(b) {
  if ((b.boundaryBounces || 0) >= 100) return null;
  for (const bnd of boundaries) {
    let nx = 0,
      ny = 0,
      pen = 0,
      hit = false;
    if (bnd.type == "circle") {
      const dx = b.x - bnd.cx,
        dy = b.y - bnd.cy,
        d = Math.hypot(dx, dy),
        md = b.radius + bnd.r;
      if (d > 0.001 && d < md) {
        nx = dx / d;
        ny = dy / d;
        pen = md - d;
        hit = true;
      }
    } else {
      let minD = Infinity,
        cx = 0,
        cy = 0;
      const v = bnd.vertices;
      for (let i = 0; i < v.length; i++) {
        const cp = closestPointOnSegment(
          b.x,
          b.y,
          v[i].x,
          v[i].y,
          v[(i + 1) % v.length].x,
          v[(i + 1) % v.length].y,
        );
        const d = Math.hypot(b.x - cp.x, b.y - cp.y);
        if (d < minD) {
          minD = d;
          cx = cp.x;
          cy = cp.y;
        }
      }
      if (minD < b.radius && minD > 0.001) {
        const dx = b.x - cx,
          dy = b.y - cy;
        nx = dx / minD;
        ny = dy / minD;
        pen = b.radius - minD;
        hit = true;
      }
    }
    if (hit) {
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) return { nx, ny, pen };
    }
  }
  return null;
}
function resolveBoundaryCollision(b, hit) {
  b.x += hit.nx * (hit.pen + 1);
  b.y += hit.ny * (hit.pen + 1);
  const dot = b.vx * hit.nx + b.vy * hit.ny;
  b.vx = (b.vx - 2 * dot * hit.nx) * 0.85;
  b.vy = (b.vy - 2 * dot * hit.ny) * 0.85;
  b.boundaryBounces = (b.boundaryBounces || 0) + 1;
}

function getParentOf(key) {

function getTreeLayout() {
  if (cachedTreeLayout) return cachedTreeLayout;
  const NW = 140,
    NH = 42,
    HG = 14,
    VG = 76;
  const sw = {};
  function subW(k) {
    if (sw[k] !== undefined) return sw[k];
    const ch = UNLOCK_TREE[k] || [];
    if (!ch.length) return (sw[k] = NW);
    return (sw[k] = Math.max(
      NW,
      ch.reduce((s, c) => s + subW(c), 0) + HG * (ch.length - 1),
    ));
  }
  Object.keys(UNLOCK_TREE).forEach((k) => subW(k));
  const positions = {};
  const visited = new Set();
  function place(k, lx, depth) {
    if (visited.has(k)) return;
    visited.add(k);
    const ch = UNLOCK_TREE[k] || [];
    const y = 70 + NH / 2 + depth * (NH + VG);
    if (!ch.length) {
      positions[k] = { x: lx + NW / 2, y, w: NW, h: NH };
      return lx + NW;
    }
    let cx = lx;
    const cxs = [];
    ch.forEach((c, i) => {
      if (i > 0) cx += HG;
      cxs.push(cx + sw[c] / 2);
      place(c, cx, depth + 1);
      cx += sw[c];
    });
    positions[k] = {
      x: (cxs[0] + cxs[cxs.length - 1]) / 2,
      y,
      w: NW,
      h: NH,
    };
    return lx + sw[k];
  }
  place("single", 60, 0);
  const allX = Object.values(positions).map((p) => p.x),
    allY = Object.values(positions).map((p) => p.y);
  return (cachedTreeLayout = {
    positions,
    totalW: Math.max(...allX) + NW / 2 + 80,
    totalH: Math.max(...allY) + NH / 2 + 60,
    NW,
    NH,
  });
}

function drawUnlockAnimations() {
  const now = Date.now();
  for (let ai = unlockAnimations.length - 1; ai >= 0; ai--) {
    const anim = unlockAnimations[ai];
    const prog = (now - anim.createdAt) / anim.duration;
    if (prog >= 1) {
      unlockAnimations.splice(ai, 1);
      continue;
    }
    const dt = 1 / 60;
    if (anim.type == "epic" && prog < 0.08) {
      ctx.fillStyle = `rgba(255,204,0,${(1 - prog / 0.08) * 0.22})`;
      ctx.fillRect(0, 0, GAME_W, GAME_H);
    }
    if (anim.type == "epic") {
      ctx.beginPath();
      ctx.arc(anim.x, anim.y, prog * 200, 0, Math.PI * 2);
      ctx.strokeStyle = colorToRgba(
        anim.color,
        Math.max(0, 1 - prog * 2),
      );
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    for (const p of anim.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
      ctx.fillStyle = colorToRgba(
        anim.color,
        Math.max(0, 1 - prog * 1.6),
      );
      ctx.fill();
    }
  }
}

  ctx.clip();
  ctx.translate(-treeScrollX, MTOP - treeScrollY);

  for (const [pk, children] of Object.entries(UNLOCK_TREE)) {
    const pp = layout.positions[pk];
    if (!pp) continue;
    for (const ck of children) {
      const cp = layout.positions[ck];
      if (!cp) continue;
      const unlk = unlockedAttacks.has(ck),
        pUnlk = unlockedAttacks.has(pk);
      ctx.beginPath();
      ctx.moveTo(pp.x, pp.y + layout.NH / 2);
      ctx.lineTo(cp.x, cp.y - layout.NH / 2);
      ctx.strokeStyle = unlk ? "#00aa44" : pUnlk ? "#2244aa" : "#1a1a2a";
      ctx.lineWidth = 2;
      ctx.stroke();
      const cost = getUnlockXP(ck);
      if (cost > 0) {
        const mx = (pp.x + cp.x) / 2,
          my = (pp.y + cp.y) / 2;
        ctx.fillStyle = unlk ? "#00aa44" : pUnlk ? "#3355aa" : "#1a1a2a";
        ctx.font = "11px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(cost + " XP", mx, my);
      }
    }
  }

  const { NW, NH } = layout;
  for (const [key, pos] of Object.entries(layout.positions)) {
    if (!attacks[key]) continue;
    const unlk = unlockedAttacks.has(key),
      parent = getParentOf(key),
      pUnlk = !parent || unlockedAttacks.has(parent);
    const cost = getUnlockXP(key),
      avail = !unlk && pUnlk,
      golden = avail && playerXP >= cost;
    const nx = pos.x - NW / 2,
      ny = pos.y - NH / 2;
    ctx.fillStyle = unlk
      ? "#081a10"
      : golden
        ? "#1a1000"
        : avail
          ? "#08101a"
          : "#050507";
    ctx.fillRect(nx, ny, NW, NH);
    if (golden) {
      ctx.save();
      ctx.shadowColor = "#ffcc00";
      ctx.shadowBlur = 14;
    }
    ctx.strokeStyle = unlk
      ? "#00cc55"
      : golden
        ? "#ffcc00"
        : avail
          ? "#1a3366"
          : "#0d0d18";
    ctx.lineWidth = unlk || golden ? 2 : 1;
    ctx.strokeRect(nx, ny, NW, NH);
    if (golden) ctx.restore();
    const atk = attacks[key];
    ctx.fillStyle = unlk
      ? "#00ff88"
      : golden
        ? "#ffcc00"
        : avail
          ? "#3355aa"
          : "#1a1a2a";
    ctx.font = (unlk ? "bold " : "") + "13px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(trimLabel(atk?.name || key, 17), pos.x, pos.y - 7);
    ctx.font = "11px monospace";
    if (unlk) {
      ctx.fillStyle = "#00aa44";
      ctx.fillText("\u2713 unlocked", pos.x, pos.y + 8);
    } else if (key == "single") {
      ctx.fillStyle = "#00aa44";
      ctx.fillText("free", pos.x, pos.y + 8);
    } else {
      ctx.fillStyle = golden ? "#ffcc00" : avail ? "#2244aa" : "#111118";
      ctx.fillText(cost + " XP", pos.x, pos.y + 8);
    }

    const bullets = atk?.bullets || [];
    const ns = Math.min(4, bullets.length);
    if (ns > 0) {
      let sx = nx + 4;
      for (let i = 0; i < ns; i++) {
        ctx.fillStyle =
          unlk || golden
            ? colorToCss(bullets[i].color ?? atk.color ?? 0xffffff)
            : "#1a1a22";
        ctx.fillRect(sx, ny + 3, 8, 8);
        sx += 10;
      }
    }
  }
  ctx.restore();
  drawUnlockAnimations();
  if (treeScrollMaxX > 0) {
    const bw = GAME_W * (GAME_W / layout.totalW);
    const bx = (treeScrollX / treeScrollMaxX) * (GAME_W - bw);
    ctx.fillStyle = "rgba(100,150,255,0.35)";
    ctx.fillRect(bx, GAME_H - 6, bw, 6);
  }
  if (treeScrollMaxY > 0) {
    const bh = (GAME_H - MTOP) * ((GAME_H - MTOP) / layout.totalH);
    const by =
      MTOP + (treeScrollY / treeScrollMaxY) * (GAME_H - MTOP - bh);
    ctx.fillStyle = "rgba(100,150,255,0.35)";
    ctx.fillRect(GAME_W - 6, by, 6, bh);
  }
}
function handlePathsClick() {
  if (mouseX >= 30 && mouseX <= 190 && mouseY >= 30 && mouseY <= 80) {
    navigateBack();
    return;
  }
  const layout = getTreeLayout();
  if (!layout) return;
  const MTOP = 95,
    tx = mouseX + treeScrollX,
    ty = mouseY - MTOP + treeScrollY,
    { NW, NH } = layout;
  for (const [key, pos] of Object.entries(layout.positions))
    if (
      tx >= pos.x - NW / 2 &&

function pickWeighted(table) {
  let r = Math.random(),
    cumulative = 0;
  for (const entry of table) {
    cumulative += entry.chance;
    if (r < cumulative) return entry;
  }
  return table[table.length - 1];
}

function spawnPointOrbs() {
  const count = pickWeighted(ORB_COUNTS).n;
  for (let i = 0; i < count; i++) {
    const orb = pickWeighted(ORB_VALUES),
      radius = 30 * Math.sqrt(orb.chance),
      margin = 108;
    const x =
      margin + radius + Math.random() * (GAME_W - (margin + radius) * 2);
    const terrainY = getTerrainY(x),
      minY = margin + radius,
      maxY = terrainY - margin - radius;
    if (maxY < minY) continue;
    const y = minY + Math.random() * (maxY - minY);
    pointOrbs.push({ x, y, v: orb.v, color: orb.color, radius });
  }
}

function getAttackPt(key) {
  const pt = attacks[key]?.pt;
  if (pt == undefined) {
    console.warn(`Attack "${key}" has no pt defined, treating as 0`);
    return 0;
  }
  return pt;
}

function getVisibleAttackList() {
  const baseList =
    gameMode == "freeplay"
      ? getAttackList()
      : getAttackList().filter((a) => isUnlocked(a.key));
  const groupAnchors = new Map(),
    noGroup = [];
  for (const a of baseList) {
    const atk = attacks[a.key],
      group = atk?.group;
    if (!group) {
      noGroup.push(a);
      continue;
    }
    if (!groupAnchors.has(group)) {
      groupAnchors.set(group, a);
    } else {
      const existing = groupAnchors.get(group),
        existingAtk = attacks[existing.key];
      const aPriority = atk?.priority ?? Infinity,
        existingPriority = existingAtk?.priority ?? Infinity;
      const anyHasPriority =
        aPriority !== Infinity || existingPriority !== Infinity;
      if (anyHasPriority) {
        if (aPriority < existingPriority) groupAnchors.set(group, a);
      } else {
        const aPt = atk?.pt ?? 0,
          existingPt = existingAtk?.pt ?? 0;
        if (aPt < existingPt) {
          groupAnchors.set(group, a);
        } else if (aPt == existingPt) {
          const ks = Object.keys(attacks);
          if (ks.indexOf(a.key) < ks.indexOf(existing.key))
            groupAnchors.set(group, a);
        }
      }
    }
  }
  return [...groupAnchors.values(), ...noGroup];
}

getAttackGroup = (key) => attacks[key]?.group ?? null;
getGroupSequence = (group) =>
  getAttackList().filter((a) => attacks[a.key]?.group == group);

function fitCanvas() {
  const sc = Math.min(
    window.innerWidth / GAME_W,
    window.innerHeight / GAME_H,
  );
  canvas.style.width = GAME_W * sc + "px";
  canvas.style.height = GAME_H * sc + "px";
}
function setMouseFromEvent(e) {
  const r = canvas.getBoundingClientRect(),
    sc = r.width / GAME_W || 1;
  mouseX = (e.clientX - r.left) / sc;
  mouseY = (e.clientY - r.top) / sc;
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (screen == "paths") {
    if (k == "arrowleft")
      treeScrollX = clamp(treeScrollX - 120, 0, treeScrollMaxX);
    if (k == "arrowright")
      treeScrollX = clamp(treeScrollX + 120, 0, treeScrollMaxX);
    if (k == "arrowup")
      treeScrollY = clamp(treeScrollY - 80, 0, treeScrollMaxY);
    if (k == "arrowdown")
      treeScrollY = clamp(treeScrollY + 80, 0, treeScrollMaxY);
  }
  if (!gameRunning || e.repeat) return;
  if (k == "q") cycleAttack(-1);
  if (k == "e") cycleAttack(1);
  const n = Number(k);
  if (Number.isInteger(n) && n > 0) selectAttack(n - 1);

    const group = attacks[current.key]?.group;

    const seq = getGroupSequence(group);
    pos = seq.findIndex((a) => a.key == current.key);
    if (pos == -1) return;
    const next =
      k == "w"
        ? seq[(pos + 1) % seq.length]

window.addEventListener("keyup", (e) => {

canvas.addEventListener("mousemove", setMouseFromEvent);

function getTerrainCollisionInfo(b) {
  if (!b || b.dead || b.x < 0 || b.x >= terrain.length) return null;
  if (b.isStaticMine) return null;
  if (b.terrainArmed == false) return null;
  const ty = getTerrainY(b.x);
  if (b.y + b.radius < ty) return null;
  const xL = getTerrainY(clamp(b.x - 1, 0, terrain.length - 1)),
    xR = getTerrainY(clamp(b.x + 1, 0, terrain.length - 1));
  let nx = xL - xR,
    ny = 2,
    len = Math.hypot(nx, ny) || 1;
  return { ty, nx: nx / len, ny: ny / len };
}
function getTerrainY(x) {
  const cx = clamp(x, 0, terrain.length - 1),
    l = Math.floor(cx),
    r = Math.min(terrain.length - 1, l + 1),
    t = cx - l;
  return terrain[l] + (terrain[r] - terrain[l]) * t;
}
function getPlayerPosition(n) {
  const x = n == 2 ? player2X : playerX;
  return { x, y: getTerrainY(x) };
}
function isProjectileInsideTerrain(b) {
  if (!b || b.x < 0 || b.x >= terrain.length) return false;
  return b.y + b.radius >= getTerrainY(b.x);
}

function getAimData() {
  const p = getPlayerPosition(currentPlayer),
    dx = mouseX - p.x,
    dy = mouseY - p.y,
    dist = Math.hypot(dx, dy),
    dirX = dist > 0.001 ? dx / dist : 0,
    dirY = dist > 0.001 ? dy / dist : -1,
    inputLen = Math.min(dist, MAX_AIM_INPUT_LENGTH),
    drawLen = Math.min(dist, MAX_AIM_DRAW_LENGTH);
  power = clamp(
    (inputLen / MAX_AIM_INPUT_LENGTH) * POWER_MAX,
    0,
    POWER_MAX,
  );
  let angle = (Math.atan2(dirX, -dirY) * 180) / Math.PI;
  if (angle > 180) angle -= 360;
  if (angle <= -180) angle += 360;
  return { player: p, dirX, dirY, drawLength: drawLen, power, angle };
}

function normalizeAttack(key, config) {
  const src = Array.isArray(config) ? { bullets: config } : config,
    bullets = src.bullets || src.projectiles || [src];
  return {
    key,
    name: src.name || humanizeKey(key),
    range: src.range ?? 1,
    weight: src.weight ?? 1,
    radius: src.radius ?? 8,
    crater: src.crater ?? 18,
    damage: src.damage ?? 10,
    color: src.color ?? 0xffffff,
    trailLength: src.trailLength ?? DEFAULT_TRAIL_LENGTH,
    bullets,
  };
}
function getAttackList() {
  return Object.entries(attacks).map(([k, c]) => normalizeAttack(k, c));
}
function getSelectedAttack() {
  const l = getAttackList();
  if (!l.length) return null;
  selectedAttackIndex = clamp(selectedAttackIndex, 0, l.length - 1);
  const sel = l[selectedAttackIndex];

  if (gameMode !== "freeplay" && !isUnlocked(sel?.key)) {
    const visible = getVisibleAttackList();
    if (!visible.length) return null;
    selectedAttackIndex = l.findIndex((a) => a.key == visible[0].key);
    return visible[0];
  }
  return sel;
}
function selectAttack(i) {
  const l = getAttackList();
  if (!l.length) return;
  selectedAttackIndex = clamp(i, 0, l.length - 1);
}
function cycleAttack(d) {
  const al = getAttackList(),
    visible = getVisibleAttackList();
  if (!visible.length) return;
  const selectedKey = getSelectedAttack()?.key,
    selectedGroup = attacks[selectedKey]?.group;
  let cur = visible.findIndex(
    (a) => a.key == selectedKey || attacks[a.key]?.group == selectedGroup,
  );
  if (cur == -1) cur = 0;
  const next = visible[(cur + d + visible.length) % visible.length];
  selectedAttackIndex = al.findIndex((a) => a.key == next.key);
}

function getAttackLayout() {
  ctx.font = "16px monospace";
  const cw = ctx.measureText("M").width || 10,
    slotW = Math.ceil(cw * ATTACK_SLOT_CHARS + ATTACK_SLOT_PAD_X * 2),
    sx = HUD_STATS_W,
    aw = GAME_W - sx - 10,
    cols = Math.max(
      1,
      Math.floor((aw + ATTACK_SLOT_GAP) / (slotW + ATTACK_SLOT_GAP)),
    ),
    totalRows = Math.ceil(getVisibleAttackList().length / cols),
    contentH =
      totalRows * ATTACK_SLOT_H +
      Math.max(0, totalRows - 1) * ATTACK_SLOT_GAP,
    sy = GAME_H - 4 - contentH;
  return {
    startX: sx,
    startY: sy,
    slotW,
    columns: cols,
    rows: totalRows,
    capacity: cols * totalRows,
  };
}

function movePlayerSmooth(d) {
  playerProgress += d;
  while (playerProgress >= 1) {
    playerX++;
    playerProgress -= 1;
    if (playerX >= terrain.length - 1) {
      playerX = terrain.length - 1;
      playerProgress = 0;
    }
  }
  while (playerProgress <= -1) {
    playerX--;
    playerProgress += 1;
    if (playerX < 0) {
      playerX = 0;
      playerProgress = 0;
    }
  }
}
function movePlayer2Smooth(d) {
  player2Progress += d;
  while (player2Progress >= 1) {
    player2X++;
    player2Progress -= 1;
    if (player2X >= terrain.length - 1) {
      player2X = terrain.length - 1;
      player2Progress = 0;
    }
  }
  while (player2Progress <= -1) {
    player2X--;
    player2Progress += 1;
    if (player2X < 0) {
      player2X = 0;
      player2Progress = 0;
    }
  }
}

function update() {
  if (!gameRunning || gameOver) {
    lastTime = Date.now();
    return;
  }
  const now = Date.now(),
    dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (turnActive && hasShot && balls.length == 0) {
    turnTimer += dt;
    if (turnTimer >= 1.0) endTurn();
  }
  let move = 0;
  if (!hasShot && turnActive) {
    if (keys["a"] || keys["arrowleft"]) move -= BASE_SPEED * dt;
    if (keys["d"] || keys["arrowright"]) move += BASE_SPEED * dt;
  }
  if (move !== 0 && fuel > 0 && turnActive && !hasShot) {
    fuel =
      gameMode == "practice" || gameMode == "freeplay"
        ? fuelMax
        : Math.max(0, fuel - Math.abs(move) * 0.25);
    if (currentPlayer == 1) movePlayerSmooth(move);
    else movePlayer2Smooth(-move);
  }
  updateRectFlashes();
  updateProjectiles(dt, now);
  for (let i = fadingTrails.length - 1; i >= 0; i--) {
    fadingTrails[i].alpha -= dt * 1.5;
    if (fadingTrails[i].alpha <= 0) fadingTrails.splice(i, 1);
  }
  updateCraters(now);
  for (let i = pointOrbs.length - 1; i >= 0; i--) {
    const o = pointOrbs[i],
      p1 = getPlayerPosition(1),
      p2 = getPlayerPosition(2),
      activeP = currentPlayer == 1 ? p1 : p2;
    if (
      Math.hypot(activeP.x - o.x, activeP.y - o.y) <=
      o.radius + PLAYER_RADIUS
    ) {
      points[currentPlayer - 1] += o.v;
      if (gameMode != "freeplay") grantXP(o.v);
      pointOrbs.splice(i, 1);
    }
  }
  if (
    playerHealth <= 0 ||
    (gameMode == "singledevice" && player2Health <= 0)
  ) {
    gameOver = true;
    winner = playerHealth <= 0 ? 2 : 1;
    setTimeout((_) => {
      restartGame();
      screen = "modeSelect";
      screenHistory = [];
    }, 3000);
  }
}

function startTurn(n) {
  currentPlayer =
    gameMode == "freeplay" || gameMode == "practice" ? 1 : n;
  turnActive = true;
  hasShot = false;
  fuel = fuelMax;
  turnTimer = 0;
  if (terrain.length && gameMode != "freeplay") spawnPointOrbs();
}
function endTurn() {
  turnActive = false;
  startTurn(
    (currentPlayer =
      gameMode == "freeplay" || gameMode == "practice"
        ? 1
        : currentPlayer == 1
          ? 2
          : 1),
  );
}

function updateProjectiles(dt, now) {
  for (const b of balls) {
    if (!b || b.dead) continue;
    if (b.delay > 0) {
      b.delay -= dt;
      continue;
    }
    b.age += dt;
    if (b.ontick) b.ontick(b, dt, now);
    if (b.terrainArmed == false && b.y + b.radius < getTerrainY(b.x) - 2)
      b.terrainArmed = true;
    if (!b.parentLocalId || !b.orbit) {
      b.vy += b.gravity * b.weight * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
  }
  for (const b of balls) {
    if (!b || b.dead) continue;
    for (let i = pointOrbs.length - 1; i >= 0; i--) {
      const o = pointOrbs[i];
      if (Math.hypot(b.x - o.x, b.y - o.y) <= b.radius + o.radius) {
        points[currentPlayer - 1] += o.v;
        if (gameMode !== "freeplay") grantXP(o.v);
        pointOrbs.splice(i, 1);
      }
    }
    if (b.parentLocalId && b.orbit) {
      const parent = findProjectile(b.shotId, b.parentLocalId);
      if (!parent || parent.dead) {
        b.parentLocalId = null;
        b.orbit = null;
        continue;
      }
      const a = b.orbit.phase + b.age * b.orbit.speed;
      b.x = parent.x + Math.sin(a) * b.orbit.radius;
      b.y = parent.y + Math.cos(a) * b.orbit.radius;
      b.vx = parent.vx + Math.cos(a) * b.orbit.radius * b.orbit.speed;
      b.vy = parent.vy - Math.sin(a) * b.orbit.radius * b.orbit.speed;
    }
  }
  for (const b of balls) {
    if (!b || b.dead) continue;
    pushTrail(b);
  }
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (!b || b.dead) continue;
    if (isOutOfBounds(b)) {
      if (b.trail && b.trail.length > 1)
        fadingTrails.push({
          trail: [...b.trail],
          color: b.color,
          radius: b.radius,
          alpha: 1.0,
        });
      if (b.mineGroup && b.mineGroup.some((x) => x && !x.dead))
        explodeProjectile(b, now);
      else markProjectileDead(b);
      continue;
    }
    const hit = resolveTerrainCollision(b);
    if (hit) {
      if (b.isStaticMine) continue;
      const dot = b.vx * hit.nx + b.vy * hit.ny;
      if (b.bounceCount > 0) {
        if (dot > 0) bounceProjectile(b, hit, now);
      } else explodeProjectile(b, now);
      continue;
    }

    const bhit = checkBoundaryCollision(b);
    if (bhit) {
      resolveBoundaryCollision(b, bhit);
      continue;
    }
    if (checksPlayerHit(b)) {
      explodeProjectile(b, now);
      continue;
    }
  }
  balls = balls.filter((b) => !b?.dead);
}

function findProjectile(sid, lid) {
  return balls.find((b) => b.shotId == sid && b.localId == lid);
}
function markProjectileDead(b) {
  if (!b || b.dead) return;
  b.dead = true;
  for (const child of balls) {
    if (child.shotId == b.shotId && child.parentLocalId == b.localId) {
      child.parentLocalId = null;
      child.orbit = null;
    }
  }
}
function pushTrail(b) {
  if (b.trailLength <= 0) return;
  b.trail.push({ x: b.x, y: b.y });
  while (b.trail.length > b.trailLength) b.trail.shift();
}
function isOutOfBounds(b) {
  return (
    b.x < -b.radius ||
    b.x > GAME_W + b.radius ||
    b.y < -GAME_H ||
    b.y > GAME_H + b.radius

}
function hitsTerrain(b) {
  const hit = getTerrainCollisionInfo(b);
  return !!hit && b.vy > 0;

function resolveTerrainCollision(b) {
  if (!b || b.dead || b.x < 0 || b.x >= terrain.length) return null;
  if (b.isStaticMine || b.terrainArmed === false) return null;
  const ty = getTerrainY(b.x);
  if (b.y + b.radius < ty) return null;
  const xL = getTerrainY(clamp(b.x - 1, 0, terrain.length - 1));
  const xR = getTerrainY(clamp(b.x + 1, 0, terrain.length - 1));
  let nx = xL - xR,
    ny = 2;
  const len = Math.hypot(nx, ny) || 1;
  nx /= len;
  ny /= len;
  // Push along surface normal instead of snapping y - prevents slope teleport
  const depth = b.y + b.radius - ty;
  const push = Math.min(depth, b.radius * 3);
  b.x -= nx * push;
  b.y -= ny * push;
  // Hard clamp at new x position
  const cty = getTerrainY(clamp(b.x, 0, terrain.length - 1));
  if (b.y + b.radius > cty) b.y = cty - b.radius;
  return { ty: cty, nx, ny };
}
function checksPlayerHit(b) {
  if (!b || b.dead) return false;
  if (b.age < SELF_HIT_ARM_TIME) return false;
  const p1 = getPlayerPosition(1),
    p2 = getPlayerPosition(2),
    hitR = b.radius + PLAYER_RADIUS;
  return (
    Math.hypot(b.x - p1.x, b.y - p1.y) <= hitR ||
    Math.hypot(b.x - p2.x, b.y - p2.y) <= hitR
  );
}

function explodeProjectile(b, now) {
  if (!b || b.dead) return;
  const group =
    Array.isArray(b.mineGroup) && b.mineGroup.length
      ? [...b.mineGroup]
      : [b];
  if (!group.includes(b)) group.push(b);
  if (b.onexplode) b.onexplode(b, now);
  for (const m of group) {
    if (!m || m.dead) continue;
    const ix = clamp(m.x, 0, GAME_W - 1),
      iy = clamp(m.y, 0, HUD_START),
      cr = Math.max(0, m.crater);
    carveCrater(ix, iy, cr);
    applyExplosionDamage(
      ix,
      iy,
      cr,
      gameMode == "freeplay" || gameMode == "practice" ? 0 : m.damage,
    );
    craters.push({
      x: ix,
      y: iy,
      radius: cr,
      createdAt: now,
      duration: Math.max(220, Math.sqrt(cr) * 90),
    });
    m.dead = true;
  }
}
function carveCrater(cx, cy, r) {
  const l = Math.max(0, Math.floor(cx - r)),
    ri = Math.min(terrain.length - 1, Math.ceil(cx + r));
  for (let x = l; x <= ri; x++) {
    const dx = x - cx,
      rem = r * r - dx * dx;
    if (rem < 0) continue;
    terrain[x] = clamp(
      Math.max(terrain[x], cy + Math.sqrt(rem)),
      GROUND_START,
      HUD_START,
    );
  }
}
function applyRectExplosionDamage(x1, y1, x2, y2, dmg) {
  const left = Math.min(x1, x2),
    right = Math.max(x1, x2),
    top = Math.min(y1, y2),
    bottom = Math.max(y1, y2);
  if (gameMode != "practice" && gameMode != "freeplay") {
    const hitRect = (p) =>
      p.x >= left && p.x <= right && p.y >= top && p.y <= bottom;
    if (hitRect(getPlayerPosition(1)))
      playerHealth = clamp(playerHealth - dmg, 0, 100);
    if (hitRect(getPlayerPosition(2)))
      player2Health = clamp(player2Health - dmg, 0, 100);
  }
  rectFlashes.push({ left, top, right, bottom, ticks: 100 });
}
function updateRectFlashes() {
  for (let i = rectFlashes.length - 1; i >= 0; i--) {
    rectFlashes[i].ticks--;
    if (rectFlashes[i].ticks <= 0) rectFlashes.splice(i, 1);
  }
}
function drawRectFlashes() {
  for (const f of rectFlashes) {
    const alpha = f.ticks / 100;
    ctx.fillStyle = `rgba(255,0,0,${alpha})`;
    ctx.fillRect(f.left, f.top, f.right - f.left, f.bottom - f.top);
  }
}
function applyExplosionDamage(x, y, r, dmg) {
  if (dmg <= 0 || r <= 0) return;
  const p1 = getPlayerPosition(1),
    p2 = getPlayerPosition(2);
  const d1 = Math.hypot(p1.x - x, p1.y - y);
  if (d1 <= r + PLAYER_RADIUS) {
    const f = 1 - clamp((d1 - PLAYER_RADIUS) / r, 0, 1);
    playerHealth = clamp(playerHealth - dmg * f, 0, 100);
  }
  const d2 = Math.hypot(p2.x - x, p2.y - y);
  if (d2 <= r + PLAYER_RADIUS) {
    const f = 1 - clamp((d2 - PLAYER_RADIUS) / r, 0, 1);
    player2Health = clamp(player2Health - dmg * f, 0, 100);
  }
}
function updateCraters(now) {
  for (let i = craters.length - 1; i >= 0; i--)
    if (now - craters[i].createdAt > craters[i].duration)
      craters.splice(i, 1);
}

function spawnSelectedAttack() {
  if (hasShot) return;
  const aim = getAimData(),
    attack = getSelectedAttack();
  if (!attack || aim.power <= 0) return;
  if (getAttackPt(attack.key) > points[currentPlayer - 1]) return;
  points[currentPlayer - 1] -= getAttackPt(attack.key);
  spawnAttack(attack, aim);
  hasShot = true;
}
function spawnStaticMine(parent, now) {
  const mineGroup = parent.mineGroup || (parent.mineGroup = []);
  const staticMine = {
    shotId: parent.shotId,
    localId: `mine_static_${parent.shotId}_${parent.bounceCount}_${now}`,
    parentLocalId: null,
    orbit: null,
    x: parent.x,
    y: getTerrainY(parent.x),
    vx: 0,
    vy: 0,
    weight: 0,
    gravity: 0,
    radius: parent.radius,
    crater: parent.crater,
    damage: parent.damage,
    color: 0xff4400,
    trailLength: 0,
    trail: [],
    age: 0,
    dead: false,
    bounce: 0,
    bounceCount: 0,
    mineGroup,
    spawnMines: false,
    isStaticMine: true,
  };
  mineGroup.push(staticMine);
  balls.push(staticMine);
}
function bounceProjectile(b, hit, now) {
  if (!b || b.dead) return;
  const restitution = clamp(
    Number.isFinite(b.bounce) ? b.bounce : 0.6,
    0,
    1,
  );
  const dot = b.vx * hit.nx + b.vy * hit.ny;
  b.vx = (b.vx - 2 * dot * hit.nx) * restitution;
  b.vy = (b.vy - 2 * dot * hit.ny) * restitution;
  b.y = hit.ty - b.radius;
  b.bounceCount = Math.max(0, (b.bounceCount || 0) - 1);
  if (b.spawnMines) spawnStaticMine(b, now);
}

function spawnAttack(attack, aim) {
  const shotId = shotCounter++,
    spawnedById = new Map(),
    baseSpeed = MAX_SHOT_SPEED * (aim.power / POWER_MAX);
  attack.bullets.forEach((spec, index) => {
    const localId = String(spec.id ?? index),
      parentId = spec.parent ?? spec.orbitOf ?? spec.follow ?? null,
      parent =
        parentId == null ? null : spawnedById.get(String(parentId)),
      context = {
        attack,
        spec,
        aim,
        player: aim.player,
        parent,
        shotId,
        index,
      },
      spawnBase = parent || aim.player;
    const wx = resolveNumber(spec.x, 0, context),
      wy = resolveNumber(spec.y, 0, context),
      lx = resolveNumber(spec.localX, 0, context),
      ly = resolveNumber(spec.localY, 0, context),
      fwd = rotateVector(aim.dirX, aim.dirY, 0),
      side = rotateVector(aim.dirX, aim.dirY, Math.PI / 2),
      spawnX = spawnBase.x + wx + side.x * lx + fwd.x * ly,
      spawnY = spawnBase.y + wy + side.y * lx + fwd.y * ly,
      off = degToRad(
        resolveNumber(spec.offset, attack.offset ?? 0, context),
      ),
      dir = rotateVector(aim.dirX, aim.dirY, off),
      range = resolveNumber(spec.range, attack.range, context),
      spd = resolveNumber(spec.speed, 1, context),
      inherit = spec.inheritVelocity ?? Boolean(parent),
      vx =
        inherit && parent ? parent.vx : dir.x * baseSpeed * range * spd,
      vy =
        inherit && parent ? parent.vy : dir.y * baseSpeed * range * spd,
      orbit = normalizeOrbit(spec, context),
      mineGroup = spec.spawnMines ? [] : null;
    const ball = {
      shotId,
      localId,
      parentLocalId: parent ? String(parentId) : null,
      x: spawnX,
      y: spawnY,
      vx,
      vy,
      weight: resolveNumber(spec.weight, attack.weight, context),
      gravity: resolveNumber(spec.gravity, PROJECTILE_GRAVITY, context),
      radius: resolveNumber(spec.radius, attack.radius, context),
      crater:
        resolveNumber(spec.crater, attack.crater, context) ??
        resolveNumber(spec.radius, attack.radius, context) * 3,
      color: spec.color ?? attack.color,
      damage: resolveNumber(spec.damage, attack.damage / 10, context),
      trailLength: resolveNumber(
        spec.trailLength,
        attack.trailLength,
        context,
      ),
      trail: [],
      orbit,
      age: 0,
      dead: false,
      bounce: spec.bounce ?? 0,
      bounceCount: spec.bounceCount ?? 0,
      mineGroup: mineGroup ?? [],
      spawnMines: Boolean(spec.spawnMines),
      isStaticMine: false,
      terrainArmed: spec.terrainArmed ?? true,
      onexplode: spec.onexplode,
      ontick: spec.ontick,
      isRect: Boolean(spec.isRect),
      rectW: resolveNumber(spec.rectW, 40, context),
      rectH: resolveNumber(spec.rectH, GAME_H, context),
      delay: spec.delay ?? 0,
      boundaryBounces: 0,
    };
    applyInitialOrbit(ball, parent);
    ball.spawnX = spawnX;
    ball.spawnY = spawnY;
    pushTrail(ball);
    balls.push(ball);
    spawnedById.set(localId, ball);
    if (mineGroup) mineGroup.push(ball);
  });
}
function normalizeOrbit(spec, context) {
  const src =
    spec.orbit ||
    (spec.orbitRadius
      ? {
          radius: spec.orbitRadius,
          speed: spec.orbitSpeed,
          phase: spec.orbitPhase,
        }
      : null);
  if (!src) return null;
  return {
    radius: resolveNumber(src.radius, 24, context),
    speed: resolveNumber(src.speed, 6, context),
    phase: resolveNumber(
      src.phase,
      degToRad(resolveNumber(src.phaseDeg, 0, context)),
      context,
    ),
  };
}
function applyInitialOrbit(b, p) {
  if (!b.orbit || !p) return;
  b.x = p.x + Math.sin(b.orbit.phase) * b.orbit.radius;
  b.y = p.y + Math.cos(b.orbit.phase) * b.orbit.radius;
}

function drawPointOrbs() {
  for (const o of pointOrbs) {
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
    ctx.fillStyle = colorToCss(o.color);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.round(o.radius)}px monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`+${o.v}`, o.x, o.y);
  }
}

function draw() {
  const now = Date.now(),
    aim = getAimData();
  ctx.clearRect(0, 0, GAME_W, GAME_H);
  drawWorldBackground();
  if (screen == "menu") {
    drawMenu();
    return;
  }
  if (screen == "modeSelect") {
    drawModeSelect();
    return;
  }
  if (screen == "settings") {
    drawSettings();
    return;
  }
  if (screen == "paths") {
    drawPaths();
    return;
  }
  if (gameOver) {
    drawTerrain();
    drawBoundaries();
    drawPlayer(getPlayerPosition(1), 1);
    drawPlayer(getPlayerPosition(2), 2);
    drawProjectileTrails();
    drawFadingTrails();
    drawProjectiles();
    drawGameOver();
    return;
  }
  if (!gameRunning) {
    drawStartMessage();
    return;
  }
  drawTerrain();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, GAME_W, HUD_START);
  ctx.clip();
  if (turnActive) drawAimLine(aim);
  drawBoundaries();
  drawCraterEffects(now);
  drawProjectileTrails();
  drawFadingTrails();
  drawProjectiles();
  drawRectFlashes();
  drawPlayer(getPlayerPosition(1), 1);
  if (gameMode == "singledevice") {
    drawPlayer(getPlayerPosition(2), 2);
    drawInactivePlayerHealthBar();
  }
  drawPointOrbs();
  ctx.restore();
  drawHUD(aim);
}
function drawWorldBackground() {
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, BG_END);
  ctx.fillStyle = "#242846";
  ctx.fillRect(0, GROUND_START, GAME_W, GROUND_END - GROUND_START);
}
function drawStartMessage() {
  ctx.fillStyle = "#dff";
  ctx.font = "48px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Click to begin", GAME_W / 2, GAME_H / 2);
}
function drawTerrain() {
  const vp = Math.min(terrain.length, GAME_W);
  ctx.fillStyle = "#414871";
  ctx.beginPath();
  ctx.moveTo(0, HUD_START);
  ctx.lineTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(GAME_W, HUD_START);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#8080ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.stroke();
  ctx.strokeStyle = "#e8e8ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.stroke();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, HUD_START);
  ctx.lineTo(GAME_W, HUD_START);
  ctx.stroke();
}
function drawAimLine(aim) {
  ctx.strokeStyle =
    aim.power >= POWER_MAX
      ? "rgba(255,255,255,0.78)"
      : "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(aim.player.x, aim.player.y);
  ctx.lineTo(
    aim.player.x + aim.dirX * aim.drawLength,
    aim.player.y + aim.dirY * aim.drawLength,
  );
  ctx.stroke();
}
function drawCraterEffects(now) {
  for (const c of craters) {
    const prog = clamp((now - c.createdAt) / c.duration, 0, 1),
      alpha = 1 - (1 - Math.cos((prog * Math.PI) / 2));
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}
function drawProjectileTrails() {
  for (const b of balls) {
    if (b.trail.length < 2) continue;
    ctx.lineWidth = Math.max(1, b.radius * 0.35);
    for (let i = 1; i < b.trail.length; i++) {
      ctx.strokeStyle = colorToRgba(b.color, (i / b.trail.length) * 0.5);
      ctx.beginPath();
      ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
      ctx.lineTo(b.trail[i].x, b.trail[i].y);
      ctx.stroke();
    }
  }
}
function drawFadingTrails() {
  for (const ft of fadingTrails) {
    if (ft.trail.length < 2) continue;
    ctx.lineWidth = Math.max(1, ft.radius * 0.35);
    for (let i = 1; i < ft.trail.length; i++) {
      ctx.strokeStyle = colorToRgba(
        ft.color,
        (i / ft.trail.length) * 0.5 * ft.alpha,
      );
      ctx.beginPath();
      ctx.moveTo(ft.trail[i - 1].x, ft.trail[i - 1].y);
      ctx.lineTo(ft.trail[i].x, ft.trail[i].y);
      ctx.stroke();
    }
  }
}
function drawProjectiles() {
  for (const b of balls) {
    ctx.fillStyle = colorToCss(b.color);
    if (b.isRect) {
      ctx.fillRect(b.x - b.rectW / 2, 0, b.rectW, b.rectH);
      continue;
    }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawPlayer(player, n) {
  const isActive = n == currentPlayer && turnActive,
    color = n == 1 ? "#00ff00" : "#ff0000";
  if (isActive) {
    ctx.strokeStyle = "#ffff00";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS + 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fill();
}
function drawInactivePlayerHealthBar() {
  const n = currentPlayer == 1 ? 2 : 1,
    pos = getPlayerPosition(n),
    health = n == 1 ? playerHealth : player2Health,
    ratio = health / 100,
    bx = pos.x - HEALTH_BAR_W / 2,

  ctx.fillStyle =
    ratio > 0.5 ? "#00ff64" : ratio > 0.25 ? "#ffff66" : "#ff5a5a";
  ctx.fillRect(bx, by, HEALTH_BAR_W * ratio, HEALTH_BAR_H);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, HEALTH_BAR_W, HEALTH_BAR_H);
  ctx.fillStyle = "#ffffff";

function drawHUD(aim) {
  ctx.fillStyle = "#000000";

  const sel = getSelectedAttack();

  drawAttackSelector();
}
function drawAttackSelector() {
  const al = getVisibleAttackList(),
    layout = getAttackLayout(),
    selectedKey = getSelectedAttack()?.key,
    selectedGroup = attacks[selectedKey]?.group;
  hudAttackSlots = [];
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (let vi = 0; vi < al.length; vi++) {
    const atk = al[vi],
      col = vi % layout.columns,
      row = Math.floor(vi / layout.columns),
      x = layout.startX + col * (layout.slotW + ATTACK_SLOT_GAP),
      y = layout.startY + row * (ATTACK_SLOT_H + ATTACK_SLOT_GAP),
      sel =
        atk.key == selectedKey ||
        attacks[atk.key]?.group == selectedGroup;
    const displayAtk =
      sel && atk.key !== selectedKey
        ? (getAttackList().find((a) => a.key == selectedKey) ?? atk)
        : atk;
    const affordable =
      getAttackPt(displayAtk.key) <= points[currentPlayer - 1];
    hudAttackSlots.push({
      index: getAttackList().findIndex((a) => a.key == atk.key),
      x,
      y,
      w: layout.slotW,
      h: ATTACK_SLOT_H,
    });
    ctx.fillStyle = sel ? "#173f3f" : affordable ? "#111827" : "#1a1a1a";
    ctx.fillRect(x, y, layout.slotW, ATTACK_SLOT_H);
    ctx.strokeStyle = sel
      ? "#7fffff"
      : affordable
        ? "#4b5563"
        : "#333333";
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(x, y, layout.slotW, ATTACK_SLOT_H);
    let sx = x + 6;
    for (const sp of displayAtk.bullets.slice(0, 4)) {
      ctx.fillStyle = affordable
        ? colorToCss(sp.color ?? displayAtk.color)
        : "#444444";
      ctx.fillRect(sx, y + 8, 10, 10);
      sx += 12;
    }
    ctx.fillStyle = affordable ? "#ffffff" : "#555555";
    ctx.fillText(
      trimLabel(displayAtk.name, ATTACK_SLOT_CHARS),
      x + 58,
      y + ATTACK_SLOT_H / 2,
    );
  }
}
function selectAttackFromHUD() {
  const s = hudAttackSlots.find(
    (c) =>
      mouseX >= c.x &&
      mouseX <= c.x + c.w &&
      mouseY >= c.y &&
      mouseY <= c.y + c.h,
  );
  if (!s) return false;
  selectAttack(s.index);
  return true;
}

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("\u2190 Back", 30 + 80, 30 + 25);
  return { x: 30, y: 30, w: 160, h: 50 };
}
function drawMenu() {
  menuButtons = [];
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  ctx.fillStyle = "#aff";
  ctx.font = "bold 80px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("GAME", GAME_W / 2, GAME_H / 2 - 180);
  const labels = ["Play", "Settings", "Extra"],
    disabled = [false, false, true],
    cx = GAME_W / 2 - MENU_BTN_W / 2,
    startY =
      GAME_H / 2 -
      (labels.length * MENU_BTN_H + (labels.length - 1) * MENU_BTN_GAP) /
        2 +
      50;
  labels.forEach((lbl, i) => {
    const y = startY + i * (MENU_BTN_H + MENU_BTN_GAP);
    drawMenuButton(
      lbl,
      cx,
      y,
      MENU_BTN_W,
      MENU_BTN_H,
      false,
      disabled[i],
    );
    menuButtons.push({
      label: lbl,
      x: cx,
      y,
      w: MENU_BTN_W,
      h: MENU_BTN_H,
      disabled: disabled[i],
    });
  });
  ctx.fillStyle = "rgba(150,220,255,0.4)";
  ctx.font = "18px monospace";
  ctx.fillText(
    "Click anywhere to enter fullscreen",
    GAME_W / 2,
    GAME_H - 40,
  );
}
function handleMenuClick() {
  for (const btn of menuButtons) {
    if (btn.disabled) continue;
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.label == "Play") navigateTo("modeSelect");
      if (btn.label == "Settings") navigateTo("settings");
    }
  }
}
function drawModeSelect() {
  modeButtons = [];
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  const back = drawBackButton();
  modeButtons.push({ label: "__back", ...back });
  ctx.fillStyle = "#aff";
  ctx.font = "bold 50px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Select Mode", GAME_W / 2, 200);
  const modes = [
    {
      key: "singledevice",
      label: "Single Device",
      desc: "2 players, 1 screen",
      disabled: false,
    },
    {
      key: "freeplay",
      label: "Freeplay",
      desc: "Infinite points + all weapons",
      disabled: false,
    },
    {
      key: "practice",
      label: "Practice",
      desc: "Earn XP to unlock weapons",
      disabled: false,
    },
    {
      key: "online",
      label: "Online",
      desc: "Coming soon",
      disabled: true,
    },
  ];
  const bw = 500,
    bh = 90,
    gap = 20,
    cx = GAME_W / 2 - bw / 2,
    startY = 280;
  modes.forEach((m, i) => {
    const y = startY + i * (bh + gap),
      active = gameMode == m.key && !m.disabled;
    drawMenuButton(m.label, cx, y, bw, bh, active, m.disabled);
    ctx.fillStyle = m.disabled ? "#333" : "rgba(150,220,255,0.5)";
    ctx.font = "18px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(m.desc, cx + bw / 2, y + bh + 2);
    if (!m.disabled)
      modeButtons.push({ key: m.key, x: cx, y, w: bw, h: bh });
  });
  const py = startY + modes.length * (bh + gap) + 20;

  const pathsy = py;
  ctx.fillStyle = "#1a1a0a";
  ctx.fillRect(cx, pathsy, bw, 55);
  ctx.strokeStyle = "#aa8800";
  ctx.lineWidth = 1;
  ctx.strokeRect(cx, pathsy, bw, 55);
  ctx.fillStyle = "#ffcc44";
  ctx.font = "bold 24px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(
    "\u2B21 Weapon Paths  \u2014  XP: " + Math.floor(playerXP),
    cx + bw / 2,
    pathsy + 27,
  );
  modeButtons.push({ key: "__paths", x: cx, y: pathsy, w: bw, h: 55 });

  const play_y = pathsy + 55 + 14;
  drawMenuButton("\u25B6 Play", cx, play_y, bw, MENU_BTN_H, false, false);
  modeButtons.push({
    key: "__play",
    x: cx,
    y: play_y,
    w: bw,
    h: MENU_BTN_H,
  });
}
function handleModeSelectClick() {
  for (const btn of modeButtons) {
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.key == "__back") {
        navigateBack();
        return;
      }
      if (btn.key == "__paths") {
        navigateTo("paths");
        return;
      }
      if (btn.key == "__play") {
        startGame();
        return;
      }
      gameMode = btn.key;
    }
  }
}
function startGame() {
  restartGame();
  if (gameMode == "freeplay" || gameMode == "practice") {
    points = Array(2).fill(Infinity);
    player2Health = -1;
  }
  screen = "game";
  gameRunning = true;
  startTurn(1);
  lastTime = Date.now();
}
function drawSettings() {
  settingsButtons = [];
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  const back = drawBackButton();
  settingsButtons.push({ key: "__back", ...back });
  ctx.fillStyle = "#aff";
  ctx.font = "bold 50px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Settings", GAME_W / 2, 160);
  ctx.fillStyle = "#dff";
  ctx.font = "28px monospace";
  ctx.fillText("Maps", GAME_W / 2, 280);
  const mapKeys = Object.keys(maps),
    bw = 220,
    bh = 55,
    gap = 16,
    total = mapKeys.length * (bw + gap) - gap;
  let sx = GAME_W / 2 - total / 2;
  const my = 320;
  mapKeys.forEach((mk) => {
    const active = settingsData.map.toLowerCase() == mk;
    drawMenuButton(
      mk[0].toUpperCase() + mk.slice(1),
      sx,
      my,
      bw,
      bh,
      active,
      false,
    );
    settingsButtons.push({
      key: "map:" + mk,
      x: sx,
      y: my,
      w: bw,
      h: bh,
    });
    sx += bw + gap;
  });
  ctx.fillStyle = "rgba(150,220,255,0.4)";
  ctx.font = "18px monospace";
  ctx.fillText("More settings coming soon", GAME_W / 2, my + bh + 50);
}
function handleSettingsClick() {
  for (const btn of settingsButtons) {
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.key == "__back") {
        navigateBack();
        return;
      }
      if (btn.key.startsWith("map:")) {
        settingsData.map = btn.key.slice(4);
        terrainf = maps[settingsData.map];
      }
    }
  }
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
async function enterFullscreen() {
  try {
    await document.documentElement.requestFullscreen();
    gameStarted = true;
  } catch (e) {
    console.log("Fullscreen failed:", e);
  }
}
function restartGame() {
  points = [0, 0];
  gameRunning = gameOver = gameStarted = turnActive = hasShot = false;
  playerHealth = player2Health = playerX = 100;
  currentPlayer = 1;
  fuel = fuelMax;
  balls = [];
  craters = [];
  pointOrbs = [];
  fadingTrails = [];
  boundaries = [];
  player2X = GAME_W - 100;
  generateTerrain();
}

canvas.addEventListener("click", (e) => {
  setMouseFromEvent(e);
  document.documentElement.requestFullscreen().catch((_) => {});
  if (screen == "menu") {
    handleMenuClick();
    return;
  }
  if (screen == "modeSelect") {
    handleModeSelectClick();
    return;
  }
  if (screen == "settings") {
    handleSettingsClick();
    return;
  }
  if (screen == "paths") {
    handlePathsClick();
    return;
  }
  if (screen == "game") {
    if (!gameRunning) {
      gameRunning = true;
      startTurn(1);
      lastTime = Date.now();
      return;
    }
    if (!turnActive) return;
    if (mouseY >= HUD_START) {
      selectAttackFromHUD();
      return;
    }
    if (!hasShot) spawnSelectedAttack();
  }
});

canvas.addEventListener(
  "wheel", e => {
    if (screen == "paths") {
      e.preventDefault();
      if (e.shiftKey) {
        treeScrollX = clamp(treeScrollX + e.deltaY, 0, treeScrollMaxX);
      } else {
        treeScrollX = clamp(treeScrollX + e.deltaX, 0, treeScrollMaxX);
        treeScrollY = clamp(treeScrollY + e.deltaY, 0, treeScrollMaxY);
      }
      return;
    }
    if (screen == "game" && gameRunning && turnActive) {
      e.preventDefault();
      cycleAttack(e.deltaY > 0 ? 1 : -1);
    }
  },
  { passive: false },
);

loadProgress();
generateTerrain();
loop();

let mediaRecorder,
  recordedChunks = [];
function startRecording() {
  recordedChunks = [];
  const stream = canvas.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "video/webm;codecs=vp9",
  });
  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = _ => {
    const blob = new Blob(recordedChunks, { type: "video/webm" }),
      a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "game.webm";
    a.click();
  };
  mediaRecorder.start();
}
function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive")
    mediaRecorder.stop();
}
</script>
