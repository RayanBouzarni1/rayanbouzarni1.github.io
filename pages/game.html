function pickWeighted(table) {

function spawnPointOrbs() {
  const count = pickWeighted(ORB_COUNTS).n;
  for (let i = 0; i < count; i++) {
    const orb = pickWeighted(ORB_VALUES);
    const radius = 30 * Math.sqrt(orb.chance);
    const margin = 108;
    const x =
      margin + radius + Math.random() * (GAME_W - (margin + radius) * 2);
    const terrainY = getTerrainY(x);
    const minY = margin + radius;
    const maxY = terrainY - margin - radius;
    if (maxY < minY) continue;
    const y = minY + Math.random() * (maxY - minY);
    pointOrbs.push({ x, y, v: orb.v, color: orb.color, radius });

function getVisibleAttackList() {
  const al = getAttackList(),
    groupAnchors = new Map(),
    noGroup = [];
  for (const a of al) {
    const atk = attacks[a.key],
      group = atk?.group;
    if (!group) {
      noGroup.push(a);
      continue;
    }
    if (!groupAnchors.has(group)) {
      groupAnchors.set(group, a);
    } else {
      const existing = groupAnchors.get(group),
        existingAtk = attacks[existing.key],
        aPriority = atk?.priority ?? Infinity,
        existingPriority = existingAtk?.priority ?? Infinity;
      const anyHasPriority =
        aPriority !== Infinity || existingPriority !== Infinity;
      if (anyHasPriority) {
        if (aPriority < existingPriority) groupAnchors.set(group, a);
      } else {
        const aPt = atk?.pt ?? 0,
          existingPt = existingAtk?.pt ?? 0;
        if (aPt < existingPt) {
          groupAnchors.set(group, a);
        } else if (aPt == existingPt) {
          const ks = Object.keys(attacks);
          if (ks.indexOf(a.key) < ks.indexOf(existing.key))
            groupAnchors.set(group, a);
        }
      }
    }
  }
  return [...groupAnchors.values(), ...noGroup];
}

function getTerrainCollisionInfo(b) {
  if (!b || b.dead || b.x < 0 || b.x >= terrain.length) return null;
  if (b.isStaticMine) return null;
  if (b.terrainArmed == false) return null;
  const ty = getTerrainY(b.x);
  if (b.y + b.radius < ty) return null;
  const xL = getTerrainY(clamp(b.x - 1, 0, terrain.length - 1)),
    xR = getTerrainY(clamp(b.x + 1, 0, terrain.length - 1));
  let nx = xL - xR,
    ny = 2,
    len = Math.hypot(nx, ny) || 1;
  return { ty, nx: nx / len, ny: ny / len };
}
function getTerrainY(x) {
  const cx = clamp(x, 0, terrain.length - 1),
    l = Math.floor(cx),
    r = Math.min(terrain.length - 1, l + 1),
    t = cx - l;
  return terrain[l] + (terrain[r] - terrain[l]) * t;
}
function getPlayerPosition(n) {
  const x = n == 2 ? player2X : playerX;
  return { x, y: getTerrainY(x) };
}
function isProjectileInsideTerrain(b) {
  if (!b || b.x < 0 || b.x >= terrain.length) return false;
  return b.y + b.radius >= getTerrainY(b.x);
}

function getAimData() {
  const p = getPlayerPosition(currentPlayer),
    dx = mouseX - p.x,
    dy = mouseY - p.y,
    dist = Math.hypot(dx, dy),
    dirX = dist > 0.001 ? dx / dist : 0,
    dirY = dist > 0.001 ? dy / dist : -1,
    inputLen = Math.min(dist, MAX_AIM_INPUT_LENGTH),
    drawLen = Math.min(dist, MAX_AIM_DRAW_LENGTH);
  power = clamp(
    (inputLen / MAX_AIM_INPUT_LENGTH) * POWER_MAX,
    0,
    POWER_MAX,
  );
  let angle = (Math.atan2(dirX, -dirY) * 180) / Math.PI;
  if (angle > 180) angle -= 360;
  if (angle <= -180) angle += 360;
  return { player: p, dirX, dirY, drawLength: drawLen, power, angle };
}

function normalizeAttack(key, config) {

function getAttackLayout() {

function movePlayerSmooth(d) {
  playerProgress += d;
  while (playerProgress >= 1) {
    playerX++;
    playerProgress -= 1;
    if (playerX >= terrain.length - 1) {
      playerX = terrain.length - 1;
      playerProgress = 0;
    }
  }
  while (playerProgress <= -1) {
    playerX--;
    playerProgress += 1;
    if (playerX < 0) {
      playerX = 0;
      playerProgress = 0;
    }
  }
}
function movePlayer2Smooth(d) {
  player2Progress += d;
  while (player2Progress >= 1) {
    player2X++;
    player2Progress -= 1;
    if (player2X >= terrain.length - 1) {
      player2X = terrain.length - 1;
      player2Progress = 0;
    }
  }
  while (player2Progress <= -1) {
    player2X--;
    player2Progress += 1;
    if (player2X < 0) {
      player2X = 0;
      player2Progress = 0;
    }
  }
}

function update() {
  if (!gameRunning || gameOver) {
    lastTime = Date.now();
    return;
  }
  const now = Date.now(),
    dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (turnActive && hasShot && balls.length == 0) {
    turnTimer += dt;
    if (turnTimer >= 1.0) endTurn();
  }
  let move = 0;
  if (!hasShot && turnActive) {
    if (keys["a"] || keys["arrowleft"]) move -= BASE_SPEED * dt;
    if (keys["d"] || keys["arrowright"]) move += BASE_SPEED * dt;
  }
  if (move !== 0 && fuel > 0 && turnActive && !hasShot) {
    fuel =
      gameMode == "practice" || gameMode == "freeplay"
        ? fuelMax
        : Math.max(0, fuel - Math.abs(move) * 0.25);
    if (currentPlayer == 1) movePlayerSmooth(move);
    else movePlayer2Smooth(-move);
  }
  updateRectFlashes();
  updateProjectiles(dt, now);
  // FIX 3: fade out saved trails over time
  for (let i = fadingTrails.length - 1; i >= 0; i--) {
    fadingTrails[i].alpha -= dt * 1.5;
    if (fadingTrails[i].alpha <= 0) fadingTrails.splice(i, 1);
  }
  updateCraters(now);
  for (let i = pointOrbs.length - 1; i >= 0; i--) {
    const o = pointOrbs[i],
      p1 = getPlayerPosition(1),
      p2 = getPlayerPosition(2),
      activeP = currentPlayer == 1 ? p1 : p2;
    if (
      Math.hypot(activeP.x - o.x, activeP.y - o.y) <=
      o.radius + PLAYER_RADIUS
    ) {
      points[currentPlayer - 1] += o.v;
      pointOrbs.splice(i, 1);
    }
  }
  if (
    playerHealth <= 0 ||
    (gameMode === "singledevice" && player2Health <= 0)
  ) {
    gameOver = true;
    winner = playerHealth <= 0 ? 2 : 1;
    setTimeout((_) => {
      restartGame();
      screen = "modeSelect";
      screenHistory = [];
    }, 3000);
  }
}

function startTurn(n) {

  turnActive = true;
  hasShot = false;
  fuel = fuelMax;

    spawnPointOrbs();
}
function endTurn() {
  turnActive = false;
  startTurn(
    (currentPlayer =
      gameMode == "freeplay" || gameMode == "practice"
        ? 1
        : currentPlayer == 1

  );
}

function updateProjectiles(dt, now) {
  for (const b of balls) {
    if (!b || b.dead) continue;
    if (b.delay > 0) {
      b.delay -= dt;
      continue;
    }
    b.age += dt;
    if (b.ontick) b.ontick(b, dt, now);
    if (b.terrainArmed == false && b.y + b.radius < getTerrainY(b.x) - 2)
      b.terrainArmed = true;
    if (!b.parentLocalId || !b.orbit) {
      b.vy += b.gravity * b.weight * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
    }
  }
  for (const b of balls) {
    if (!b || b.dead) continue;
    for (let i = pointOrbs.length - 1; i >= 0; i--) {
      const o = pointOrbs[i];
      if (Math.hypot(b.x - o.x, b.y - o.y) <= b.radius + o.radius) {
        points[currentPlayer - 1] += o.v;
        pointOrbs.splice(i, 1);
      }
    }
    if (b.parentLocalId && b.orbit) {
      const parent = findProjectile(b.shotId, b.parentLocalId);
      if (!parent || parent.dead) {
        b.parentLocalId = null;
        b.orbit = null;
        continue;
      }
      const a = b.orbit.phase + b.age * b.orbit.speed;
      b.x = parent.x + Math.sin(a) * b.orbit.radius;
      b.y = parent.y + Math.cos(a) * b.orbit.radius;
      b.vx = parent.vx + Math.cos(a) * b.orbit.radius * b.orbit.speed;
      b.vy = parent.vy - Math.sin(a) * b.orbit.radius * b.orbit.speed;
    }
  }
  for (const b of balls) {
    if (!b || b.dead) continue;
    pushTrail(b);
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    if (!b || b.dead) continue;

    if (isOutOfBounds(b)) {
      // FIX 3: save the trail so it can keep fading on screen
      if (b.trail && b.trail.length > 1)
        fadingTrails.push({
          trail: [...b.trail],
          color: b.color,
          radius: b.radius,
          alpha: 1.0,
        });
      if (b.mineGroup && b.mineGroup.some((x) => x && !x.dead))
        explodeProjectile(b, now);
      else markProjectileDead(b);
      continue;
    }

    const hit = resolveTerrainCollision(b);
    if (hit) {
      if (b.isStaticMine) continue;
      // FIX 1: only bounce when actually moving into the terrain surface
      const dot = b.vx * hit.nx + b.vy * hit.ny;
      if (b.bounceCount > 0) {
        if (dot > 0) bounceProjectile(b, hit, now);
        // dot <= 0 means ball is leaving the slope — position was already corrected, skip reflection
      } else {
        explodeProjectile(b, now);
      }
      continue;
    }

    if (checksPlayerHit(b)) {
      explodeProjectile(b, now);
      continue;
    }
  }
  balls = balls.filter((b) => !b?.dead);
}

function findProjectile(sid, lid) {
  return balls.find((b) => b.shotId == sid && b.localId == lid);
}
function markProjectileDead(b) {
  if (!b || b.dead) return;
  b.dead = true;
  for (const child of balls) {
    if (child.shotId == b.shotId && child.parentLocalId == b.localId) {
      child.parentLocalId = null;
      child.orbit = null;
    }
  }
}
function pushTrail(b) {
  if (b.trailLength <= 0) return;
  b.trail.push({ x: b.x, y: b.y });
  while (b.trail.length > b.trailLength) b.trail.shift();
}
function isOutOfBounds(b) {
  return (
    b.x < -b.radius ||
    b.x > GAME_W + b.radius ||
    b.y < -GAME_H ||
    b.y > GAME_H + b.radius

}
function hitsTerrain(b) {
  const hit = getTerrainCollisionInfo(b);
  return !!hit && b.vy > 0;
}
function resolveTerrainCollision(b) {
  const hit = getTerrainCollisionInfo(b);
  if (!hit) return null;
  b.y = hit.ty - b.radius;
  return hit;
}

function checksPlayerHit(b) {
  if (!b || b.dead) return false;
  if (b.age < SELF_HIT_ARM_TIME) return false;
  const p1 = getPlayerPosition(1),
    p2 = getPlayerPosition(2),
    hitR = b.radius + PLAYER_RADIUS;
  return (
    Math.hypot(b.x - p1.x, b.y - p1.y) <= hitR ||
    Math.hypot(b.x - p2.x, b.y - p2.y) <= hitR
  );
}

function explodeProjectile(b, now) {

  const group =
    Array.isArray(b.mineGroup) && b.mineGroup.length
      ? [...b.mineGroup]
      : [b];
  if (!group.includes(b)) group.push(b);
  if (b.onexplode) b.onexplode(b, now);
  for (const m of group) {
    if (!m || m.dead) continue;
    const ix = clamp(m.x, 0, GAME_W - 1),
      iy = clamp(m.y, 0, HUD_START),
      cr = Math.max(0, m.crater);
    carveCrater(ix, iy, cr);
    applyExplosionDamage(
      ix,
      iy,
      cr,
      gameMode == "freeplay" || gameMode == "practice" ? 0 : m.damage,
    );
    craters.push({
      x: ix,
      y: iy,
      radius: cr,
      createdAt: now,
      duration: Math.max(220, Math.sqrt(cr) * 90),
    });
    m.dead = true;
  }
}

function carveCrater(cx, cy, r) {
  const l = Math.max(0, Math.floor(cx - r)),
    ri = Math.min(terrain.length - 1, Math.ceil(cx + r));
  for (let x = l; x <= ri; x++) {
    const dx = x - cx,
      rem = r * r - dx * dx;
    if (rem < 0) continue;
    terrain[x] = clamp(
      Math.max(terrain[x], cy + Math.sqrt(rem)),
      GROUND_START,
      HUD_START,
    );
  }
}
function applyRectExplosionDamage(x1, y1, x2, y2, dmg) {
  const left = Math.min(x1, x2),
    right = Math.max(x1, x2),
    top = Math.min(y1, y2),
    bottom = Math.max(y1, y2);
  if (gameMode != "practice" && gameMode != "freeplay") {
    const hitRect = (p) =>
      p.x >= left && p.x <= right && p.y >= top && p.y <= bottom;
    if (hitRect(getPlayerPosition(1)))
      playerHealth = clamp(playerHealth - dmg, 0, 100);
    if (hitRect(getPlayerPosition(2)))
      player2Health = clamp(player2Health - dmg, 0, 100);
  }
  rectFlashes.push({ left, top, right, bottom, ticks: 100 });
}
function updateRectFlashes() {
  for (let i = rectFlashes.length - 1; i >= 0; i--) {
    rectFlashes[i].ticks--;
    if (rectFlashes[i].ticks <= 0) rectFlashes.splice(i, 1);
  }
}
function drawRectFlashes() {
  for (const f of rectFlashes) {
    const alpha = f.ticks / 100;
    ctx.fillStyle = `rgba(255,0,0,${alpha})`;
    ctx.fillRect(f.left, f.top, f.right - f.left, f.bottom - f.top);
  }
}
function applyExplosionDamage(x, y, r, dmg) {
  if (dmg <= 0 || r <= 0) return;
  const p1 = getPlayerPosition(1),
    p2 = getPlayerPosition(2);
  const d1 = Math.hypot(p1.x - x, p1.y - y);
  if (d1 <= r + PLAYER_RADIUS) {
    const f = 1 - clamp((d1 - PLAYER_RADIUS) / r, 0, 1);
    playerHealth = clamp(playerHealth - dmg * f, 0, 100);
  }
  const d2 = Math.hypot(p2.x - x, p2.y - y);
  if (d2 <= r + PLAYER_RADIUS) {
    const f = 1 - clamp((d2 - PLAYER_RADIUS) / r, 0, 1);
    player2Health = clamp(player2Health - dmg * f, 0, 100);
  }
}
function updateCraters(now) {
  for (let i = craters.length - 1; i >= 0; i--)
    if (now - craters[i].createdAt > craters[i].duration)
      craters.splice(i, 1);
}

function spawnSelectedAttack() {
  if (hasShot) return;
  const aim = getAimData(),
    attack = getSelectedAttack();
  if (!attack || aim.power <= 0) return;
  if (getAttackPt(attack.key) > points[currentPlayer - 1]) return;
  points[currentPlayer - 1] -= getAttackPt(attack.key);
  spawnAttack(attack, aim);
  hasShot = true;
}

function spawnStaticMine(parent, now) {
  const mineGroup = parent.mineGroup || (parent.mineGroup = []);
  const staticMine = {
    shotId: parent.shotId,
    localId: `mine_static_${parent.shotId}_${parent.bounceCount}_${now}`,
    parentLocalId: null,
    orbit: null,
    x: parent.x,
    y: getTerrainY(parent.x),
    vx: 0,
    vy: 0,
    weight: 0,
    gravity: 0,
    radius: parent.radius,
    crater: parent.crater,
    damage: parent.damage,
    color: 0xff4400,
    trailLength: 0,
    trail: [],
    age: 0,
    dead: false,
    bounce: 0,
    bounceCount: 0,
    mineGroup,
    spawnMines: false,
    isStaticMine: true,
  };
  mineGroup.push(staticMine);
  balls.push(staticMine);
}

function bounceProjectile(b, hit, now) {
  if (!b || b.dead) return;
  const restitution = clamp(
    Number.isFinite(b.bounce) ? b.bounce : 0.6,
    0,
    1,
  );
  const dot = b.vx * hit.nx + b.vy * hit.ny;
  b.vx = (b.vx - 2 * dot * hit.nx) * restitution;
  b.vy = (b.vy - 2 * dot * hit.ny) * restitution;
  b.y = hit.ty - b.radius;
  b.bounceCount = Math.max(0, (b.bounceCount || 0) - 1);
  if (b.spawnMines) spawnStaticMine(b, now);
}

function spawnAttack(attack, aim) {
  const shotId = shotCounter++,
    spawnedById = new Map(),
    baseSpeed = MAX_SHOT_SPEED * (aim.power / POWER_MAX);
  attack.bullets.forEach((spec, index) => {
    const localId = String(spec.id ?? index),
      parentId = spec.parent ?? spec.orbitOf ?? spec.follow ?? null,
      parent =
        parentId == null ? null : spawnedById.get(String(parentId)),
      context = {
        attack,
        spec,
        aim,
        player: aim.player,
        parent,
        shotId,
        index,
      },
      spawnBase = parent || aim.player;
    const wx = resolveNumber(spec.x, 0, context),
      wy = resolveNumber(spec.y, 0, context),
      lx = resolveNumber(spec.localX, 0, context),
      ly = resolveNumber(spec.localY, 0, context),
      fwd = rotateVector(aim.dirX, aim.dirY, 0),
      side = rotateVector(aim.dirX, aim.dirY, Math.PI / 2),
      spawnX = spawnBase.x + wx + side.x * lx + fwd.x * ly,
      spawnY = spawnBase.y + wy + side.y * lx + fwd.y * ly,
      off = degToRad(
        resolveNumber(spec.offset, attack.offset ?? 0, context),
      ),
      dir = rotateVector(aim.dirX, aim.dirY, off),
      range = resolveNumber(spec.range, attack.range, context),
      spd = resolveNumber(spec.speed, 1, context),
      inherit = spec.inheritVelocity ?? Boolean(parent),
      vx =
        inherit && parent ? parent.vx : dir.x * baseSpeed * range * spd,
      vy =
        inherit && parent ? parent.vy : dir.y * baseSpeed * range * spd,
      orbit = normalizeOrbit(spec, context),
      mineGroup = spec.spawnMines ? [] : null;
    const ball = {
      shotId,
      localId,
      parentLocalId: parent ? String(parentId) : null,
      x: spawnX,
      y: spawnY,
      vx,
      vy,
      weight: resolveNumber(spec.weight, attack.weight, context),
      gravity: resolveNumber(spec.gravity, PROJECTILE_GRAVITY, context),
      radius: resolveNumber(spec.radius, attack.radius, context),
      crater:
        resolveNumber(spec.crater, attack.crater, context) ??
        resolveNumber(spec.radius, attack.radius, context) * 3,
      color: spec.color ?? attack.color,
      damage: resolveNumber(spec.damage, attack.damage / 10, context),
      trailLength: resolveNumber(
        spec.trailLength,
        attack.trailLength,
        context,
      ),
      trail: [],
      orbit,
      age: 0,
      dead: false,
      bounce: spec.bounce ?? 0,
      bounceCount: spec.bounceCount ?? 0,
      mineGroup: mineGroup ?? [],
      spawnMines: Boolean(spec.spawnMines),
      isStaticMine: false,
      terrainArmed: spec.terrainArmed ?? true,
      onexplode: spec.onexplode,
      ontick: spec.ontick,
      isRect: Boolean(spec.isRect),
      rectW: resolveNumber(spec.rectW, 40, context),
      rectH: resolveNumber(spec.rectH, GAME_H, context),
      delay: spec.delay ?? 0,
    };
    applyInitialOrbit(ball, parent);
    ball.spawnX = spawnX;
    ball.spawnY = spawnY;
    pushTrail(ball);
    balls.push(ball);
    spawnedById.set(localId, ball);
    if (mineGroup) mineGroup.push(ball);
  });
}

function normalizeOrbit(spec, context) {
  const src =
    spec.orbit ||
    (spec.orbitRadius
      ? {
          radius: spec.orbitRadius,
          speed: spec.orbitSpeed,
          phase: spec.orbitPhase,
        }
      : null);
  if (!src) return null;
  return {
    radius: resolveNumber(src.radius, 24, context),
    speed: resolveNumber(src.speed, 6, context),
    phase: resolveNumber(
      src.phase,
      degToRad(resolveNumber(src.phaseDeg, 0, context)),
      context,
    ),
  };
}
function applyInitialOrbit(b, p) {
  if (!b.orbit || !p) return;
  b.x = p.x + Math.sin(b.orbit.phase) * b.orbit.radius;
  b.y = p.y + Math.cos(b.orbit.phase) * b.orbit.radius;
}

function drawPointOrbs() {
  for (const o of pointOrbs) {
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
    ctx.fillStyle = colorToCss(o.color);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${Math.round(o.radius)}px monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(`+${o.v}`, o.x, o.y);
  }
}

function draw() {
  const now = Date.now(),
    aim = getAimData();
  ctx.clearRect(0, 0, GAME_W, GAME_H);
  drawWorldBackground();
  if (screen === "menu") {
    drawMenu();
    return;
  }
  if (screen === "modeSelect") {
    drawModeSelect();
    return;
  }
  if (screen === "settings") {
    drawSettings();
    return;
  }
  if (gameOver) {
    drawTerrain();
    drawPlayer(getPlayerPosition(1), 1);
    drawPlayer(getPlayerPosition(2), 2);
    drawProjectileTrails();
    drawFadingTrails();
    drawProjectiles();
    drawGameOver();
    return;
  }
  if (!gameRunning) {
    drawStartMessage();
    return;
  }
  drawTerrain();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, GAME_W, HUD_START);
  ctx.clip();
  if (turnActive) drawAimLine(aim);
  drawCraterEffects(now);
  drawProjectileTrails();
  drawFadingTrails();
  drawProjectiles();
  drawRectFlashes();
  drawPlayer(getPlayerPosition(1), 1);
  if (gameMode === "singledevice") {
    drawPlayer(getPlayerPosition(2), 2);
    drawInactivePlayerHealthBar();
  }
  drawPointOrbs();
  ctx.restore();
  drawHUD(aim);
}
function drawWorldBackground() {
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, BG_END);
  ctx.fillStyle = "#242846";
  ctx.fillRect(0, GROUND_START, GAME_W, GROUND_END - GROUND_START);
}
function drawStartMessage() {
  ctx.fillStyle = "#dff";
  ctx.font = "48px monospace";
  ctx.textAlign = "center";

  ctx.fillText("Click to begin", GAME_W / 2, GAME_H / 2);
}
function drawTerrain() {
  const vp = Math.min(terrain.length, GAME_W);
  ctx.fillStyle = "#414871";
  ctx.beginPath();
  ctx.moveTo(0, HUD_START);
  ctx.lineTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.lineTo(GAME_W, HUD_START);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#8080ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.stroke();
  ctx.strokeStyle = "#e8e8ff";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, terrain[0]);
  for (let x = 1; x < vp; x++) ctx.lineTo(x, terrain[x]);
  ctx.stroke();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, HUD_START);
  ctx.lineTo(GAME_W, HUD_START);
  ctx.stroke();
}
function drawAimLine(aim) {
  ctx.strokeStyle =
    aim.power >= POWER_MAX
      ? "rgba(255,255,255,0.78)"
      : "rgba(255,255,255,0.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(aim.player.x, aim.player.y);
  ctx.lineTo(
    aim.player.x + aim.dirX * aim.drawLength,
    aim.player.y + aim.dirY * aim.drawLength,
  );
  ctx.stroke();
}
function drawCraterEffects(now) {
  for (const c of craters) {
    const prog = clamp((now - c.createdAt) / c.duration, 0, 1),
      alpha = 1 - (1 - Math.cos((prog * Math.PI) / 2));
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.7})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
}
function drawProjectileTrails() {
  for (const b of balls) {
    if (b.trail.length < 2) continue;
    ctx.lineWidth = Math.max(1, b.radius * 0.35);
    for (let i = 1; i < b.trail.length; i++) {
      ctx.strokeStyle = colorToRgba(b.color, (i / b.trail.length) * 0.5);
      ctx.beginPath();
      ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
      ctx.lineTo(b.trail[i].x, b.trail[i].y);
      ctx.stroke();
    }
  }
}
// FIX 3: draw saved trails that are fading out after their projectile left the screen
function drawFadingTrails() {
  for (const ft of fadingTrails) {
    if (ft.trail.length < 2) continue;
    ctx.lineWidth = Math.max(1, ft.radius * 0.35);
    for (let i = 1; i < ft.trail.length; i++) {
      ctx.strokeStyle = colorToRgba(
        ft.color,
        (i / ft.trail.length) * 0.5 * ft.alpha,
      );
      ctx.beginPath();
      ctx.moveTo(ft.trail[i - 1].x, ft.trail[i - 1].y);
      ctx.lineTo(ft.trail[i].x, ft.trail[i].y);
      ctx.stroke();
    }
  }
}
function drawProjectiles() {
  for (const b of balls) {
    ctx.fillStyle = colorToCss(b.color);
    if (b.isRect) {
      ctx.fillRect(b.x - b.rectW / 2, 0, b.rectW, b.rectH);
      continue;
    }
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawPlayer(player, n) {
  const isActive = n == currentPlayer && turnActive,
    color = n == 1 ? "#00ff00" : "#ff0000";
  if (isActive) {
    ctx.strokeStyle = "#ffff00";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, PLAYER_RADIUS + 4, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, PLAYER_RADIUS, 0, Math.PI * 2);
  ctx.fill();
}
function drawInactivePlayerHealthBar() {
  const n = currentPlayer == 1 ? 2 : 1,
    pos = getPlayerPosition(n),
    health = n == 1 ? playerHealth : player2Health,
    ratio = health / 100,
    bx = pos.x - HEALTH_BAR_W / 2,
    by = pos.y - HEALTH_BAR_OFFSET_Y - HEALTH_BAR_H;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(bx, by, HEALTH_BAR_W, HEALTH_BAR_H);
  ctx.fillStyle =
    ratio > 0.5 ? "#00ff64" : ratio > 0.25 ? "#ffff66" : "#ff5a5a";
  ctx.fillRect(bx, by, HEALTH_BAR_W * ratio, HEALTH_BAR_H);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, HEALTH_BAR_W, HEALTH_BAR_H);
  ctx.fillStyle = "#ffffff";
  ctx.font = "14px monospace";
  ctx.textAlign = "center";

  ctx.fillText(`P${n} ${Math.round(health)}%`, pos.x, by - 2);

function drawHUD(aim) {
  ctx.fillStyle = "#000000";

}
function drawAttackSelector() {
  const al = getVisibleAttackList(),
    layout = getAttackLayout(),
    selectedKey = getSelectedAttack()?.key,
    selectedGroup = attacks[selectedKey]?.group;
  hudAttackSlots = [];
  ctx.font = "16px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (let vi = 0; vi < al.length; vi++) {
    const atk = al[vi],
      col = vi % layout.columns,
      row = Math.floor(vi / layout.columns),
      x = layout.startX + col * (layout.slotW + ATTACK_SLOT_GAP),
      y = layout.startY + row * (ATTACK_SLOT_H + ATTACK_SLOT_GAP),
      sel =
        atk.key == selectedKey ||
        attacks[atk.key]?.group == selectedGroup;
    const displayAtk =
      sel && atk.key !== selectedKey
        ? (getAttackList().find((a) => a.key == selectedKey) ?? atk)
        : atk;
    const affordable =
      getAttackPt(displayAtk.key) <= points[currentPlayer - 1];
    hudAttackSlots.push({
      index: getAttackList().findIndex((a) => a.key == atk.key),
      x,
      y,
      w: layout.slotW,
      h: ATTACK_SLOT_H,
    });
    ctx.fillStyle = sel ? "#173f3f" : affordable ? "#111827" : "#1a1a1a";
    ctx.fillRect(x, y, layout.slotW, ATTACK_SLOT_H);
    ctx.strokeStyle = sel
      ? "#7fffff"
      : affordable
        ? "#4b5563"
        : "#333333";
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeRect(x, y, layout.slotW, ATTACK_SLOT_H);
    let sx = x + 6;
    for (const sp of displayAtk.bullets.slice(0, 4)) {
      ctx.fillStyle = affordable
        ? colorToCss(sp.color ?? displayAtk.color)
        : "#444444";
      ctx.fillRect(sx, y + 8, 10, 10);
      sx += 12;
    }
    ctx.fillStyle = affordable ? "#ffffff" : "#555555";
    ctx.fillText(
      trimLabel(displayAtk.name, ATTACK_SLOT_CHARS),
      x + 58,
      y + ATTACK_SLOT_H / 2,
    );
  }
}
function selectAttackFromHUD() {
  const s = hudAttackSlots.find(
    (c) =>
      mouseX >= c.x &&
      mouseX <= c.x + c.w &&
      mouseY >= c.y &&
      mouseY <= c.y + c.h,
  );
  if (!s) return false;
  selectAttack(s.index);
  return true;
}

        2 +
      50;
  labels.forEach((lbl, i) => {
    const y = startY + i * (MENU_BTN_H + MENU_BTN_GAP);
    drawMenuButton(
      lbl,
      cx,
      y,
      MENU_BTN_W,
      MENU_BTN_H,
      false,
      disabled[i],
    );
    menuButtons.push({
      label: lbl,
      x: cx,
      y,
      w: MENU_BTN_W,
      h: MENU_BTN_H,
      disabled: disabled[i],
    });
  });
  ctx.fillStyle = "rgba(150,220,255,0.4)";
  ctx.font = "18px monospace";
  ctx.fillText(
    "Click anywhere to enter fullscreen",
    GAME_W / 2,
    GAME_H - 40,
  );
}
function handleMenuClick() {
  for (const btn of menuButtons) {
    if (btn.disabled) continue;
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.label === "Play") navigateTo("modeSelect");
      if (btn.label === "Settings") navigateTo("settings");
    }
  }
}
function drawModeSelect() {
  modeButtons = [];
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  const back = drawBackButton();
  modeButtons.push({ label: "__back", ...back });
  ctx.fillStyle = "#aff";
  ctx.font = "bold 50px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Select Mode", GAME_W / 2, 200);
  const modes = [
    {
      key: "singledevice",
      label: "Single Device",
      desc: "2 players, 1 screen",
      disabled: false,
    },
    {
      key: "freeplay",
      label: "Freeplay",
      desc: "Infinite points, no opponent",
      disabled: false,
    },
    {
      key: "practice",
      label: "Practice",
      desc: "Same as Freeplay for now",
      disabled: false,
    },
    {
      key: "online",
      label: "Online",
      desc: "Coming soon",
      disabled: true,
    },
  ];
  const bw = 500,
    bh = 90,
    gap = 20,
    cx = GAME_W / 2 - bw / 2,
    startY = 320;
  modes.forEach((m, i) => {
    const y = startY + i * (bh + gap),
      active = gameMode === m.key && !m.disabled;
    drawMenuButton(m.label, cx, y, bw, bh, active, m.disabled);
    ctx.fillStyle = m.disabled ? "#333" : "rgba(150,220,255,0.5)";
    ctx.font = "18px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(m.desc, cx + bw / 2, y + bh + 2);
    if (!m.disabled)
      modeButtons.push({ key: m.key, x: cx, y, w: bw, h: bh });
  });
  const py = startY + modes.length * (bh + gap) + 30;
  drawMenuButton("\u25B6 Play", cx, py, bw, MENU_BTN_H, false, false);
  modeButtons.push({ key: "__play", x: cx, y: py, w: bw, h: MENU_BTN_H });
}
function handleModeSelectClick() {
  for (const btn of modeButtons) {
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.key === "__back") {
        navigateBack();
        return;
      }
      if (btn.key === "__play") {
        startGame();
        return;
      }
      gameMode = btn.key;
    }
  }
}
function startGame() {
  restartGame();
  if (gameMode === "freeplay" || gameMode === "practice") {
    points = Array(2).fill(Infinity);
    player2Health = -1;
  }
  screen = "game";
  gameRunning = true;
  startTurn(1);
  lastTime = Date.now();
}
function drawSettings() {
  settingsButtons = [];
  ctx.fillStyle = "#16162a";
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  const back = drawBackButton();
  settingsButtons.push({ key: "__back", ...back });
  ctx.fillStyle = "#aff";
  ctx.font = "bold 50px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Settings", GAME_W / 2, 160);
  ctx.fillStyle = "#dff";
  ctx.font = "28px monospace";
  ctx.fillText("Maps", GAME_W / 2, 280);
  const mapKeys = Object.keys(maps),
    bw = 220,
    bh = 55,
    gap = 16,
    total = mapKeys.length * (bw + gap) - gap;
  let sx = GAME_W / 2 - total / 2;
  const my = 320;
  mapKeys.forEach((mk) => {
    const active = settingsData.map.toLowerCase() === mk;
    drawMenuButton(
      mk[0].toUpperCase() + mk.slice(1),
      sx,
      my,
      bw,
      bh,
      active,
      false,
    );
    settingsButtons.push({
      key: "map:" + mk,
      x: sx,
      y: my,
      w: bw,
      h: bh,
    });
    sx += bw + gap;
  });
  ctx.fillStyle = "rgba(150,220,255,0.4)";
  ctx.font = "18px monospace";
  ctx.fillText("More settings coming soon", GAME_W / 2, my + bh + 50);
}
function handleSettingsClick() {
  for (const btn of settingsButtons) {
    if (
      mouseX >= btn.x &&
      mouseX <= btn.x + btn.w &&
      mouseY >= btn.y &&
      mouseY <= btn.y + btn.h
    ) {
      if (btn.key === "__back") {
        navigateBack();
        return;
      }
      if (btn.key.startsWith("map:")) {
        settingsData.map = btn.key.slice(4);
        terrainf = maps[settingsData.map];
      }
    }
  }
}
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
async function enterFullscreen() {
  try {
    await document.documentElement.requestFullscreen();
    gameStarted = true;
  } catch (e) {
    console.log("Fullscreen failed:", e);
  }
}
function restartGame() {
  points = [0, 0];
  gameRunning = gameOver = gameStarted = turnActive = hasShot = false;
  playerHealth = player2Health = playerX = 100;
  currentPlayer = 1;
  fuel = fuelMax;
  balls = [];
  craters = [];
  pointOrbs = [];
  fadingTrails = []; // FIX 3: clear fading trails on restart
  player2X = GAME_W - 100;
  generateTerrain();
}

canvas.addEventListener("click", (e) => {
  setMouseFromEvent(e);
  if (screen === "menu") {
    if (document.fullscreenElement === null)
      document.documentElement.requestFullscreen().catch(() => {});
    handleMenuClick();
    return;
  }
  if (screen === "modeSelect") {
    handleModeSelectClick();
    return;
  }
  if (screen === "settings") {
    handleSettingsClick();
    return;
  }
  if (screen === "game") {
    if (!gameRunning) {
      gameRunning = true;
      startTurn(1);
      lastTime = Date.now();
      return;
    }
    if (!turnActive) return;
    if (mouseY >= HUD_START) {
      selectAttackFromHUD();
      return;
    }
    if (!hasShot) spawnSelectedAttack();
  }
});

// FIX 2: mouse wheel scrolls through weapon groups in the HUD
canvas.addEventListener(
  "wheel",
  (e) => {
    if (screen === "game" && gameRunning && turnActive) {
      e.preventDefault();
      cycleAttack(e.deltaY > 0 ? 1 : -1);
    }
  },
  { passive: false },
);

generateTerrain();
loop();

let mediaRecorder,
  recordedChunks = [];
function startRecording() {
  recordedChunks = [];
  const stream = canvas.captureStream(60);
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: "video/webm;codecs=vp9",
  });
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = (_) => {
    const blob = new Blob(recordedChunks, { type: "video/webm" }),
      a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "game.webm";
    a.click();
  };
  mediaRecorder.start();
}
function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive")
    mediaRecorder.stop();
}
</script>
