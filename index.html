<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My pages</title>
        <meta name="author" content="Rayan Bouzarni">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="All of my projects on a single page.">
        <link rel="icon" href="pages/icon.png" type="image/png">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
 
            * { box-sizing: border-box; margin: 0; padding: 0; }
 
            html {
                font-family: 'Share Tech Mono', monospace;
                color: #dff;
                display: flex;
                padding: 2em;
                background:
                    linear-gradient(135deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 63, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 127, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 63, 127, 0.4) 0%, transparent 75%);
                background-color: #0a0a0a;
                min-height: 100vh;
                background-attachment: fixed;
            }
 
            body {
                width: 100%;
            }
 
            h1 {
                font-family: 'Orbitron', sans-serif;
                font-size: 1.6em;
                letter-spacing: 0.12em;
                color: #aff;
                margin-bottom: 1.2em;
                text-shadow: 0 0 18px rgba(0,255,255,0.3);
            }
 
            .buttons {
                display: flex;
                flex-direction: column;
                gap: 0.6em;
            }
 
            button {
                font-family: 'Orbitron', sans-serif;
                cursor: pointer;
                border: 2px solid transparent;
                border-radius: 4px;
                min-height: 2em;
                min-width: 10em;
                width: fit-content;
                padding: 0.5em 1em;
                font-size: 1.2em;
                text-align: center;
                background:
                    linear-gradient(135deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 63, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 127, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 63, 127, 0.4) 0%, transparent 75%),
                    padding-box,
                    linear-gradient(135deg, rgba(0, 0, 255, 0.4) 0%, transparent 75%),
                    linear-gradient(-45deg, rgba(0, 0, 127, 0.4) 0%, transparent 75%),
                    linear-gradient(45deg, rgba(0, 255, 255, 0.4) 0%, transparent 75%),
                    linear-gradient(-135deg, rgba(0, 127, 255, 0.4) 0%, transparent 75%);
                color: #dff;
                transition: opacity 0.15s;
            }
 
            button:hover { opacity: 0.8; }
 
            p {
                font-size: 0.85em;
                color: rgba(150, 220, 255, 0.6);
                line-height: 1.6;
                margin-top: 0.2em;
            }
        </style>
    </head>
    <body>
        <h1>My pages</h1>
        <p>All of RayanBouzarni1's projects can be found here. If you have any issues, questions, suggestions or found any bugs, please submit them <a href='https://discord.gg/bZWWrSfec'>here</a></p>
        <div class="buttons"></div>
        <script type="module">
            const listRes = await fetch("./list.json");
            const files = await listRes.json();
            const container = document.querySelector(".buttons");

            for (const file of files) {
                const button = document.createElement("button");
                button.innerHTML = "<b>" + (file[0].toUpperCase() + file.slice(1)).replace(/_/g, " ") + "</b>";
                button.onclick = _ => window.location.href = `./pages/${file}.html`;
                container.appendChild(button);

                const pageRes = await fetch(`./pages/${file}.json`);
                const data = await pageRes.json();

                const desc = document.createElement("p");
                desc.textContent = data.desc;
                desc.innerHTML += "<br><br>";
                container.appendChild(desc);
            }
        </script>
    </body>
</html>
